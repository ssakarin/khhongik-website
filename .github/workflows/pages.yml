name: Deploy clinic website

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 22 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: clinic-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Prepare static website
        run: |
          mkdir site
          cp -- *.html *.css *.js sitemap.xml site/
          cp -R assets site/
      - name: Refresh Naver blog links
        if: github.event_name == 'schedule'
        run: python3 scripts/refresh-blog.py site/blog.html
      - name: Refresh Naver blog links for changes
        if: github.event_name != 'schedule'
        run: python3 scripts/refresh-blog.py site/blog.html --allow-unavailable
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
